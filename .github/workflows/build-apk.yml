name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync

      - name: Generate Debug Keystore (Fresh on CI)
        run: |
          keytool -genkey -v \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "C=US, O=Android, CN=Android Debug"

      - name: Print Android SHA-1 Hash (for Firebase Console)
        run: |
          dos2unix android/gradlew 2>/dev/null || true
          chmod +x android/gradlew
          cd android
          ./gradlew signingReport 2>&1 | grep -A8 'Variant: debug'

      - name: Copy Alarm Sound to Android Resources
        run: |
          mkdir -p android/app/src/main/res/raw
          cp src/assets/bell2.mp3 android/app/src/main/res/raw/bell2.mp3

      - name: Fix gradlew permissions and line endings
        run: |
          sudo apt-get update && sudo apt-get install -y dos2unix
          dos2unix android/gradlew
          chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: human-os-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
